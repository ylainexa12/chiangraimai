<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Réservation envoyée</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Arial, sans-serif;
      background: #f7f3ed;
      color: #222;
    }

    .message {
      max-width: 500px;
      padding: 40px 25px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-family: Georgia, serif;
      color: #b98238;
    }

    p {
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 22px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>

<body>

  <div class="message">
    <h1>Merci !</h1>

    <p>
      Votre demande de réservation a bien été envoyée.
      Vous recevrez un email de confirmation.
    </p>

    <a href="https://chiangraimai.fr">
      Retour au site
    </a>
  </div>

</body>

</html>
